<!doctype html>
<!--
  index.html — the only HTML page. Every screen (home, lobby, games)
  is drawn inside <main id="app"> by JavaScript.
  All paths are RELATIVE (./css, ./js) so the site works under
  username.github.io/repo-name/ as well as on localhost.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="description" content="Play party games with friends on your phone. No install, no signup.">
  <title>FlashGames</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Home">
      <span class="logo" aria-hidden="true">⚡</span>
      <span id="brand-name">FlashGames</span>
    </a>
    <div class="topbar-actions">
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch light or dark mode">🌓</button>
    </div>
  </header>
  <div id="connection-banner" class="connection-banner" role="status" hidden>Offline — reconnecting…</div>

  <main id="app">
    <p class="muted center">Loading…</p>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <noscript>FlashGames needs JavaScript switched on.</noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
