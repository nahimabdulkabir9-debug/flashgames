<!doctype html>
<!--
  index.html — the only HTML page. Every screen (home, lobby, games)
  is drawn inside <main id="app"> by JavaScript.
  All paths are RELATIVE (./css, ./js) so the site works under
  username.github.io/repo-name/ as well as on localhost.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4bdb">
  <meta name="description" content="Play party games with friends on your phone. No install, no signup.">
  <title>FlashGames</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./?home=1" aria-label="Home">
      <span class="logo" aria-hidden="true">⚡</span>
      <span id="brand-name">FlashGames</span>
    </a>
    <div class="topbar-actions">
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch light or dark mode" aria-pressed="false">🌓</button>
    </div>
  </header>
  <div id="connection-banner" class="connection-banner" role="status" hidden>Offline — reconnecting…</div>

  <main id="app">
    <p class="muted center">Loading…</p>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <noscript>FlashGames needs JavaScript switched on.</noscript>
  <script type="module" src="./js/app.js"></script>
  <script>
    // Last-resort fallback: if the module or Firebase CDN fails before app.js
    // can draw anything, replace the permanent "Loading…" with a real message.
    function flashgamesLoadFailed() {
      var app = document.getElementById('app');
      if (!app || app.textContent.indexOf('Loading') === -1) return;
      app.textContent = '';
      var card = document.createElement('section');
      card.className = 'card stack';
      var title = document.createElement('h2');
      title.textContent = "Can't load 😕";
      var text = document.createElement('p');
      text.textContent = 'Check your internet connection and refresh the page.';
      var link = document.createElement('a');
      link.className = 'btn secondary';
      link.href = './?check=1';
      link.textContent = 'Run setup check';
      card.append(title, text, link);
      app.append(card);
    }
    window.addEventListener('error', function (event) {
      // Ignore a failed favicon or other resource; only module/script errors
      // can leave the app stuck on "Loading…".
      if (!event.target || event.target.tagName === 'SCRIPT') flashgamesLoadFailed();
    }, true);
    window.addEventListener('unhandledrejection', flashgamesLoadFailed);
  </script>
</body>
</html>
